            -e "ssh -i ~/.ssh/deploy_key -p 21098 -o StrictHostKeyChecking=no" \
            docs/html/ bmicmqfq@bmichaud.com:~/public_html/Sdr/docs/SpeechApp/

      - uses: actions/checkout@v4
        with: { repository: OpenRFStack/SdrScanner, path: SdrScanner }
      - name: Doxygen SdrScanner
        run: |
          cd SdrScanner && doxygen Doxyfile
          rsync -az --delete \
