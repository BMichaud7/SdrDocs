            -e "ssh -i ~/.ssh/deploy_key -p 21098 -o StrictHostKeyChecking=no" \
            docs/html/ bmicmqfq@bmichaud.com:~/public_html/Sdr/docs/AcquisitionApp/

      - uses: actions/checkout@v4
        with: { repository: OpenRFStack/AnalysisApp, path: AnalysisApp }
      - name: Doxygen AnalysisApp
        run: |
          cd AnalysisApp && doxygen Doxyfile
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 21098 -o StrictHostKeyChecking=no" \
            docs/html/ bmicmqfq@bmichaud.com:~/public_html/Sdr/docs/AnalysisApp/

      - uses: actions/checkout@v4
        with: { repository: OpenRFStack/DemodApp, path: DemodApp }
      - name: Doxygen DemodApp
        run: |
          cd DemodApp && doxygen Doxyfile
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 21098 -o StrictHostKeyChecking=no" \
            docs/html/ bmicmqfq@bmichaud.com:~/public_html/Sdr/docs/DemodApp/

      - uses: actions/checkout@v4
        with: { repository: OpenRFStack/DfApp, path: DfApp }
      - name: Doxygen DfApp
        run: |
          cd DfApp && doxygen Doxyfile
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 21098 -o StrictHostKeyChecking=no" \
            docs/html/ bmicmqfq@bmichaud.com:~/public_html/Sdr/docs/DfApp/

      - uses: actions/checkout@v4
        with: { repository: OpenRFStack/SpeechApp, path: SpeechApp }
