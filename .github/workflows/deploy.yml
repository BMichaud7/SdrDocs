name: Deploy

on:
  push:
    branches: ["main/1.0"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Sdr/ to bmichaud.com
        env:
          DEPLOY_KEY: ${{ secrets.DOCS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 21098 bmichaud.com >> ~/.ssh/known_hosts 2>/dev/null

          # Deploy all SdrDocs files to /Sdr/
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 21098 -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            . \
            bmicmqfq@bmichaud.com:~/public_html/Sdr/

          echo "Deployed to https://bmichaud.com/Sdr/"

      - name: List deployed pages
        run: |
          echo "pages.json deployed — bmichaud.com/ updates on next load."
          python3 -c 'import json; [print("  "+p["title"]+" -> "+p["url"]) for p in json.load(open("pages.json"))]'
